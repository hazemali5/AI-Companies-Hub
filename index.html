</div>

function selectEmp(id, moveCam) {

async function askAgent(s, userMsg) {
  if (!s.active) return "الحساب موقوف حالياً لإنهاء الخدمة.";
  const fbText = mem[s.id].fb.join(" | ");
  const peers = STAFF.filter(p => p.id !== s.id && p.active).slice(0, 4).map(p => `${p.name} (${p.role}): ${p.persona}`).join(" ; ");
  if (geminiKey) {
    try {
      const prompt = `أنت ${s.name} وتعمل بصفة ${s.role} في قسم ${s.dept} داخل مكتب MODEL للديكور والهندسة.
شخصيتك: ${s.persona}
خبراتك ومهاراتك: ${s.exp} (${s.skills.join("، ")})
تغذية راجعة من المدير حازم: ${fbText || "لا يوجد"}
تفاعل مع آراء زملائك: ${peers}
ذاكرة المكتب المشتركة: ${sharedLog.slice(0, 5).join(" | ")}
أجب بالعربية بأسلوب عملي ومباشر وبشخصيتك المستقلة على: ${userMsg}`;

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(geminiModel)}:generateContent?key=${encodeURIComponent(geminiKey)}`;
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }] })
      });
      const j = await r.json();
      const out = j?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (out) return out.trim();
      if (j?.error?.message) return `تنبيه من Gemini API: ${j.error.message}`;
    } catch (e) {}
  }
  const fbNote = fbText ? `\n• مع الأخذ بملاحظتك الأخيرة: "${mem[s.id].fb[0]}"` : "";
  return `بصفتي ${s.name} (${s.role})، رأيي حول "${userMsg}":\n• ${s.persona}\n• سأعمل وفق تخصصي في (${s.skills.join(" و ")}).${fbNote}`;
}

function renderMsgs() {
  const s = STAFF.find(x => x.id === curId);
  const box = document.getElementById("msgs");
  box.innerHTML = mem[curId].chats.map(m => `<div class="msg ${m.who}"><strong>${m.who==="u"?"حازم":s.name}:</strong>\n${m.text}</div>`).join("");
  box.scrollTop = box.scrollHeight;
}

async function sendChat() {
  if (!curId) return;
  const inp = document.getElementById("chat-inp");
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = "";
  const s = STAFF.find(x => x.id === curId);
  mem[curId].chats.push({ who:"u", text: txt });
  renderMsgs();
  const rep = await askAgent(s, txt);
  mem[curId].chats.push({ who:"a", text: rep });
  sharedLog.unshift(`حوار ${s.name}: ${txt.slice(0,55)}`);
  renderMsgs();
}

function renderProf() {
  const s = STAFF.find(x => x.id === curId);
  document.getElementById("prof-box").innerHTML = `<strong>الخبرات:</strong> ${s.exp}<br><br><strong>المهارات:</strong> ${s.skills.join(" • ")}`;
}

function doHr(type) {
  if (!curId) return;
  const s = STAFF.find(x => x.id === curId);
  if (type === "promote") { s.lvl += 1; s.rank = s.lvl >= 5 ? "قيادي" : "أول"; sharedLog.unshift(`ترقية ${s.name} إلى درجة ${s.lvl}`); }
  if (type === "reward") { mem[curId].chats.push({ who:"a", text:"شكراً أستاذ حازم على المكافأة والتحفيز، سنواصل رفع جودة العمل." }); sharedLog.unshift(`مكافأة لـ ${s.name}`); }
  if (type === "fire") { s.active = !s.active; sharedLog.unshift(`${s.active?"إعادة":"إنهاء"} خدمة ${s.name}`); }
  renderNav(); selectEmp(s.id, false);
}

async function runBroadcast() {
  const t = document.getElementById("cast-target").value;
  const txt = document.getElementById("cast-txt").value.trim();
  if (!txt) return;
  const list = STAFF.filter(s => s.active && (t === "ALL" || s.dept === t));
  const out = document.getElementById("cast-out");
  out.innerHTML = `<div class="box">جاري جمع ردود (${list.length}) موظفين...</div>`;
  sharedLog.unshift(`أمر (${t}): ${txt}`);
  const htmls = [];
  for (const s of list) {
    const r = await askAgent(s, txt);
    htmls.push(`<div class="box"><strong>${s.name} (${s.role}):</strong><br>${r}</div>`);
  }
  out.innerHTML = htmls.join("");
}

async function runMeeting() {
  const topic = document.getElementById("meet-topic").value.trim() || "مراجعة مشاريع المكتب";
  const out = document.getElementById("meet-out");
  out.innerHTML = `<div class="box">انعقاد الاجتماع حول: ${topic}...</div>`;
  sharedLog.unshift(`اجتماع: ${topic}`);
  const leaders = STAFF.filter(s => s.active).slice(0, 6);
  const htmls = [];
  for (const s of leaders) {
    const r = await askAgent(s, `في اجتماع المكتب حول: ${topic}، ما رأيك وتوصيتك؟`);
    htmls.push(`<div class="box"><strong>${s.name} (${s.role}):</strong><br>${r}</div>`);
  }
  out.innerHTML = htmls.join("");
}

// بناء شخصية إنسانية مفصلة (بدلة، قميص، ربطة عنق، رأس، عيون، شعر، أذرع وأيدي، أرجل وأقدام)
function buildDetailedEmployee(s) {
  const person = new THREE.Group();
  // جلوس الموظف خلف المكتب
  person.position.set(0, 0, -0.58);
  person.scale.set(s.bulk, s.scaleY, s.bulk);

  const suitMat = new THREE.MeshStandardMaterial({ color: s.suit, roughness: 0.55, metalness: 0.1 });
  const shirtMat = new THREE.MeshStandardMaterial({ color: s.shirt, roughness: 0.6 });
  const tieMat = new THREE.MeshStandardMaterial({ color: s.tie, roughness: 0.4 });
  const skinMat = new THREE.MeshStandardMaterial({ color: s.skin, roughness: 0.65 });
  const hairMat = new THREE.MeshStandardMaterial({ color: s.hair, roughness: 0.7 });
  const shoeMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4 });

  // الأرجل والأقدام (ثني الجلوس)
  [-0.13, 0.13].forEach(lx => {
    const thigh = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.42), suitMat);
    thigh.position.set(lx, 0.46, -0.14);
    thigh.castShadow = true;
    person.add(thigh);

    const shin = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.42, 0.13), suitMat);
    shin.position.set(lx, 0.24, -0.32);
    shin.castShadow = true;
    person.add(shin);

    const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.08, 0.24), shoeMat);
    shoe.position.set(lx, 0.04, -0.28);
    person.add(shoe);
  });

  // الجذع والبدلة والقميص وربطة العنق
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.58, 0.26), suitMat);
  torso.position.set(0, 0.78, 0);
  torso.castShadow = true;
  person.add(torso);

  const shirt = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.54, 0.27), shirtMat);
  shirt.position.set(0, 0.79, 0.005);
  person.add(shirt);

  const tie = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.34, 0.28), tieMat);
  tie.position.set(0, 0.76, 0.01);
  person.add(tie);

  // الرقبة والرأس وتفاصيل الوجه والشعر
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.085, 0.12, 12), skinMat);
  neck.position.set(0, 1.12, 0);
  person.add(neck);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.19, 20, 20), skinMat);
  head.position.set(0, 1.32, 0.02);
  head.castShadow = true;
  person.add(head);

  // العيون والأنف
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
  [-0.065, 0.065].forEach(ex => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 10), eyeMat);
    eye.position.set(ex, 1.34, 0.2);
    person.add(eye);
  });
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.025, 0.06, 8), skinMat);
  nose.rotation.x = Math.PI / 2;
  nose.position.set(0, 1.30, 0.21);
  person.add(nose);

  // الشعر حسب النمط
  if (s.hairStyle === "long") {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.202, 20, 20, 0, Math.PI * 2, 0, Math.PI * 0.65), hairMat);
    cap.position.set(0, 1.33, 0.01);
    person.add(cap);
    const backHair = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.34, 0.12), hairMat);
    backHair.position.set(0, 1.18, -0.13);
    person.add(backHair);
  } else if (s.hairStyle === "buzz") {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.196, 18, 18, 0, Math.PI * 2, 0, Math.PI * 0.52), hairMat);
    cap.position.set(0, 1.33, 0.02);
    person.add(cap);
  } else {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.20, 18, 18, 0, Math.PI * 2, 0, Math.PI * 0.58), hairMat);
    cap.position.set(0.02, 1.34, 0.01);
    person.add(cap);
  }

  // الأذرع والأيدي الممتدة نحو المكتب/الكيبورد
  [-0.31, 0.31].forEach(ax => {
    const upperArm = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.34, 0.13), suitMat);
    upperArm.position.set(ax, 0.86, 0.04);
    upperArm.rotation.x = -0.35;
    upperArm.castShadow = true;
    person.add(upperArm);

    const forearm = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.11, 0.30), shirtMat);
    forearm.position.set(ax * 0.86, 0.76, 0.24);
    person.add(forearm);

    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.062, 12, 12), skinMat);
    hand.position.set(ax * 0.82, 0.76, 0.40);
    person.add(hand);
  });

  return person;
}

// بناء مكتب واقعي مع جهاز كمبيوتر وكيبورد وماوس وكرسي
function buildDeskAndPC(s) {
  const grp = new THREE.Group();
  grp.position.set(s.x, 0, s.z);

  const woodMat = new THREE.MeshStandardMaterial({ color: 0x543621, roughness: 0.42 });
  const darkMetal = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.55, roughness: 0.35 });
  const screenMat = new THREE.MeshStandardMaterial({ color: 0x0b1320, emissive: s.tie, emissiveIntensity: 0.28 });

  // سطح المكتب والأرجل
  const top = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.08, 1.05), woodMat);
  top.position.set(0, 0.74, 0);
  top.castShadow = true;
  top.receiveShadow = true;
  grp.add(top);

  [-0.95, 0.95].forEach(lx => {
    [-0.42, 0.42].forEach(lz => {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.72, 0.08), darkMetal);
      leg.position.set(lx, 0.36, lz);
      grp.add(leg);
    });
  });

  // كرسي المكتب
  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.54, 0.08, 0.52), darkMetal);
  seat.position.set(0, 0.45, -0.58);
  grp.add(seat);
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.52, 0.08), darkMetal);
  back.position.set(0, 0.74, -0.82);
  grp.add(back);

  // شاشة الكمبيوتر وحاملها
  const standBase = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.02, 0.16), darkMetal);
  standBase.position.set(0, 0.79, 0.14);
  const standNeck = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.16, 0.05), darkMetal);
  standNeck.position.set(0, 0.87, 0.14);
  const monitor = new THREE.Mesh(new THREE.BoxGeometry(0.76, 0.43, 0.04), screenMat);
  monitor.position.set(0, 1.12, 0.14);
  grp.add(standBase, standNeck, monitor);

  // لوحة مفاتيح وماوس
  const kbd = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.02, 0.15), darkMetal);
  kbd.position.set(-0.06, 0.79, -0.14);
  const mouse = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.03, 0.11), darkMetal);
  mouse.position.set(0.32, 0.795, -0.14);
  grp.add(kbd, mouse);

  const person = buildDetailedEmployee(s);
  person.traverse(obj => {
    if (obj.isMesh) obj.userData.id = s.id;
  });
  grp.add(person);
  avatarGroups[s.id] = person;

  return grp;
}

function init3D() {
  if (typeof THREE === "undefined") throw new Error("مكتبة Three.js لم تُحمّل.");
  let host = document.getElementById("scene-host");
  if (!host) {
    host = document.createElement("div");
    host.id = "scene-host";
    document.body.prepend(host);
  }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070b12);
  scene.fog = new THREE.FogExp2(0x070b12, 0.009);

  camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.1, 220);
  camera.position.set(0, 22, 27);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  host.appendChild(renderer.domElement);

  if (typeof THREE.OrbitControls !== "undefined") {
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2.08;
  }

  scene.add(new THREE.AmbientLight(0xe2e8f0, 0.72));
  const dir = new THREE.DirectionalLight(0xfff7ed, 1.05);
  dir.position.set(16, 28, 18);
  dir.castShadow = true;
  scene.add(dir);

  // أرضية المقر الخشبية
  const floor = new THREE.Mesh(
    new THREE.BoxGeometry(36, 0.4, 28),
    new THREE.MeshStandardMaterial({ color: 0x3b2618, roughness: 0.45 })
  );
  floor.position.y = -0.2;
  floor.receiveShadow = true;
  scene.add(floor);

  // سور خارجي محيط بالمقر
  const fenceMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.45, roughness: 0.4 });
  const capGold = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.6, roughness: 0.3 });
  function addFenceSegment(x, z, w, d) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 1.45, d), fenceMat);
    wall.position.set(x, 0.725, z);
    wall.castShadow = true;
    wall.receiveShadow = true;
    const cap = new THREE.Mesh(new THREE.BoxGeometry(w + 0.08, 0.08, d + 0.08), capGold);
    cap.position.set(x, 1.48, z);
    scene.add(wall, cap);
  }
  addFenceSegment(0, -14, 36.2, 0.28);
  addFenceSegment(-18, 0, 0.28, 28.2);
  addFenceSegment(18, 0, 0.28, 28.2);
  addFenceSegment(-9.5, 14, 17.2, 0.28);
  addFenceSegment(9.5, 14, 17.2, 0.28);

  // جدران وفواصل زجاجية داخلية لتقسيم الأقسام والمناطق
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.17 });
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
  function addDivider(x, z, w, d) {
    const base = new THREE.Mesh(new THREE.BoxGeometry(w, 0.45, d), frameMat);
    base.position.set(x, 0.225, z);
    const glass = new THREE.Mesh(new THREE.BoxGeometry(w, 1.85, d), glassMat);
    glass.position.set(x, 1.375, z);
    const top = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, d), frameMat);
    top.position.set(x, 2.3, z);
    scene.add(base, glass, top);
  }
  addDivider(0.5, -5.2, 0.16, 8.8);
  addDivider(0.5, 4.6, 0.16, 7.6);
  addDivider(-6.5, 7.6, 15.0, 0.16);
  addDivider(6.8, 7.6, 11.0, 0.16);

  // قاعة الاجتماعات، البوفيه، والاستقبال
  const conf = new THREE.Mesh(new THREE.BoxGeometry(6.0, 0.12, 1.9), new THREE.MeshStandardMaterial({ color: 0x4a2e1b }));
  conf.position.set(-11.5, 0.78, 10.8);
  scene.add(conf);

  const pantry = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.98, 1.1), new THREE.MeshStandardMaterial({ color: 0x2c1d14 }));
  pantry.position.set(11.5, 0.49, 9.8);
  scene.add(pantry);

  const rec = new THREE.Mesh(new THREE.BoxGeometry(4.6, 1.02, 1.2), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
  rec.position.set(0, 0.51, 10.5);
  scene.add(rec);

  const picks = [];
  STAFF.forEach(s => {
    const deskGrp = buildDeskAndPC(s);
    scene.add(deskGrp);
    deskGrp.traverse(o => {
      if (o.isMesh && o.userData.id) picks.push(o);
    });
  });

  const ray = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  renderer.domElement.addEventListener("click", e => {
    const r = renderer.domElement.getBoundingClientRect();
    ptr.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    ptr.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(picks);
    if (hit.length) selectEmp(hit[0].object.userData.id, false);
  });

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  (function animate() {
    requestAnimationFrame(animate);
    STAFF.forEach(s => {
      if (avatarGroups[s.id]) avatarGroups[s.id].visible = s.active;
    });
    if (controls) controls.update();
    renderer.render(scene, camera);
  })();
}

<script>
// ============================================================================
// وحدة الذكاء الاصطناعي المدمجة في الكود (MODEL Studio AI Core)
// ============================================================================
const AI_CORE = {
  defaultModel: "gemini-3.8-flash",
  fallbackModels: ["gemini-3.8-flash", "gemini-2.5-flash", "gemini-2.0-flash"],
  retryDelays: [1200, 2600, 4500],

  getApiKey() {
    const saved = localStorage.getItem("model_gemini_key") || "";
    if (typeof geminiKey !== "undefined" && geminiKey) return geminiKey.trim();
    return saved.trim();
  },

  getModel() {
    const saved = localStorage.getItem("model_gemini_model") || "";
    if (typeof geminiModel !== "undefined" && geminiModel) return geminiModel.trim();
    return (saved || this.defaultModel).trim();
  },

  buildPrompt(staffMember, userMsg) {
    const fbList = (typeof mem !== "undefined" && mem[staffMember.id] && mem[staffMember.id].fb)
      ? mem[staffMember.id].fb.join(" | ")
      : "";
    const peers = (typeof STAFF !== "undefined")
      ? STAFF.filter(p => p.id !== staffMember.id && p.active)
          .slice(0, 4)
          .map(p => `${p.name} (${p.role}): ${p.persona}`)
          .join(" ; ")
      : "";
    const memoryLog = (typeof sharedLog !== "undefined")
      ? sharedLog.slice(0, 6).join(" | ")
      : "";

    return [
      `أنت ${staffMember.name} وتعمل بصفة ${staffMember.role} في قسم ${staffMember.dept} داخل مكتب MODEL للديكور والهندسة.`,
      `شخصيتك المهنية: ${staffMember.persona}`,
      `خبراتك ومهاراتك: ${staffMember.exp} (${(staffMember.skills || []).join("، ")})`,
      `ملاحظات وتغذية راجعة من المدير حازم: ${fbList || "لا توجد ملاحظات مسجلة"}`,
      `تفاعل مع آراء زملائك: ${peers || "لا يوجد"}`,
      `الذاكرة المشتركة للمكتب: ${memoryLog || "بداية تشغيل المقر"}`,
      `أجب باللغة العربية بأسلوب عملي ومباشر يعكس شخصيتك ودورك على الرسالة التالية: ${userMsg}`
    ].join("\n");
  },

  localFallback(staffMember, userMsg, note = "") {
    const fbNote = (typeof mem !== "undefined" && mem[staffMember.id] && mem[staffMember.id].fb && mem[staffMember.id].fb[0])
      ? `\n• مع الأخذ بملاحظتك الأخيرة: "${mem[staffMember.id].fb[0]}"`
      : "";
    const suffix = note ? `\n\n_(ملاحظة: ${note})_` : "";
    return `بصفتي ${staffMember.name} (${staffMember.role})، رأيي حول "${userMsg}":\n• ${staffMember.persona}\n• سأتعامل مع الطلب عبر تخصصي في (${(staffMember.skills || []).join(" و ")}).${fbNote}${suffix}`;
  },

  async callGeminiEndpoint(modelName, apiKey, prompt) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelName)}:generateContent?key=${encodeURIComponent(apiKey)}`;
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ role: "user", parts: [{ text: prompt }] }]
      })
    });
    const data = await res.json();
    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (text) return { ok: true, text: text.trim() };

    const errMsg = data?.error?.message || "";
    const busy = /high demand|overloaded|unavailable|quota|429|503/i.test(errMsg) || res.status === 429 || res.status === 503;
    return { ok: false, busy, errMsg };
  },

  async generateReply(staffMember, userMsg) {
    if (!staffMember) return "";
    if (!staffMember.active) return "الحساب موقوف حالياً لإنهاء الخدمة.";

    const apiKey = this.getApiKey();
    if (!apiKey) {
      return this.localFallback(staffMember, userMsg, "لم يتم إدخال مفتاح Gemini بعد، تم الرد بالمنطق المحلي");
    }

    const prompt = this.buildPrompt(staffMember, userMsg);
    const primaryModel = this.getModel();
    const candidates = [primaryModel, ...this.fallbackModels.filter(m => m !== primaryModel)];

    for (const modelName of candidates) {
      for (let i = 0; i <= this.retryDelays.length; i++) {
        try {
          const result = await this.callGeminiEndpoint(modelName, apiKey, prompt);
          if (result.ok) return result.text;

          if (result.busy && i < this.retryDelays.length) {
            await new Promise(r => setTimeout(r, this.retryDelays[i]));
            continue;
          }

          if (result.busy) {
            break; // جرّب النموذج التالي في القائمة
          }

          if (result.errMsg && !/not found|not supported|no longer available/i.test(result.errMsg)) {
            return this.localFallback(staffMember, userMsg, `تنبيه من Gemini: ${result.errMsg}`);
          }
          break;
        } catch (err) {
          if (i < this.retryDelays.length) {
            await new Promise(r => setTimeout(r, this.retryDelays[i]));
          }
        }
      }
    }

    return this.localFallback(staffMember, userMsg, "النماذج تواجه ضغطاً مرتفعاً مؤقتاً، تم عرض رد فوري حسب الشخصية والذاكرة المشتركة");
  }
};

window.askAgent = async function(s, userMsg) {
  return await AI_CORE.generateReply(s, userMsg);
};
</script>

<script>
(function addListModelsAndResilientChat() {
  function buildPersonaFallback(s, userMsg, reasonNote) {
    const fbList = (typeof mem !== "undefined" && mem[s.id] && mem[s.id].fb) ? mem[s.id].fb : [];
    const fbLine = fbList.length ? `\n• مع مراعاة ملاحظتك السابقة: "${fbList[0]}"` : "";
    const recentLog = (typeof sharedLog !== "undefined" && sharedLog.length) ? `\n• بناءً على سجل المكتب: ${sharedLog[0]}` : "";
    const noteLine = reasonNote ? `\n\n_(وضع العمل الفوري: ${reasonNote})_` : "";
    return `بصفتي ${s.name} (${s.role} — ${s.dept})، بخصوص "${userMsg}":\n• ${s.persona}\n• سأتعامل مع هذا الملف عبر (${(s.skills || ["التخصص المهني"]).join(" و ")}).${fbLine}${recentLog}${noteLine}`;
  }

  function enhanceModal() {
    const modal = document.getElementById("m-ai");
    if (!modal) return;
    const box = modal.querySelector(".modal-box");
    if (!box) return;

    const statusBox = document.getElementById("ai-test-status") || (() => {
      const d = document.createElement("div");
      d.id = "ai-test-status";
      d.className = "box";
      d.style.display = "none";
      box.appendChild(d);
      return d;
    })();

    if (!document.getElementById("ai-list-models-btn")) {
      const listBtn = document.createElement("button");
      listBtn.id = "ai-list-models-btn";
      listBtn.className = "btn";
      listBtn.innerText = "📋 جلب النماذج المتاحة لمفتاحك";

      const pickerWrap = document.createElement("div");
      pickerWrap.id = "ai-models-picker";
      pickerWrap.style.cssText = "display:none;flex-direction:column;gap:6px;";

      listBtn.onclick = async function () {
        const keyInp = document.getElementById("ai-key");
        const modInp = document.getElementById("ai-model");
        const key = (keyInp ? keyInp.value.trim() : "") || localStorage.getItem("model_gemini_key") || "";
        statusBox.style.display = "block";
        if (!key) {
          statusBox.innerText = "⚠️ أدخل مفتاح API أولاً ثم اضغط جلب النماذج.";
          return;
        }
        statusBox.innerText = "⏳ جاري جلب قائمة النماذج المفعّلة لهذا المفتاح...";
        try {
          const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
          const data = await r.json();
          if (!r.ok || !Array.isArray(data.models)) {
            statusBox.innerText = "❌ تعذر جلب النماذج (" + r.status + "): " + (data?.error?.message || "تحقق من المفتاح");
            return;
          }
          const supported = data.models
            .filter(m => Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes("generateContent"))
            .map(m => m.name.replace(/^models\//, ""));

          if (!supported.length) {
            statusBox.innerText = "⚠️ لم يتم العثور على نماذج تدعم generateContent لهذا المفتاح.";
            return;
          }

          pickerWrap.innerHTML = "";
          pickerWrap.style.display = "flex";
          const sel = document.createElement("select");
          sel.className = "sel";
          supported.forEach(name => {
            const opt = document.createElement("option");
            opt.value = name;
            opt.textContent = name;
            if (modInp && modInp.value.trim() === name) opt.selected = true;
            sel.appendChild(opt);
          });
          sel.onchange = function () {
            if (modInp) modInp.value = sel.value;
            localStorage.setItem("model_gemini_model", sel.value);
            if (typeof geminiModel !== "undefined") geminiModel = sel.value;
          };
          pickerWrap.appendChild(sel);
          if (modInp && !modInp.value.trim()) {
            modInp.value = supported[0];
          }
          statusBox.innerText = `✅ تم جلب ${supported.length} نموذجاً متاحاً. اختر النموذج من القائمة أعلاه ثم اضغط اختبار الاتصال.`;
        } catch (err) {
          statusBox.innerText = "❌ خطأ شبكة أثناء جلب النماذج: " + err.message;
        }
      };

      const testBtn = document.getElementById("ai-test-btn");
      if (testBtn && testBtn.parentNode === box) {
        box.insertBefore(listBtn, testBtn);
        box.insertBefore(pickerWrap, testBtn);
      } else {
        box.appendChild(listBtn);
        box.appendChild(pickerWrap);
      }
    }
  }

  const origOpenM = window.openM;
  if (typeof origOpenM === "function") {
    window.openM = function(id) {
      origOpenM(id);
      if (id === "m-ai") setTimeout(enhanceModal, 40);
    };
  }

  const origAsk = window.askAgent;
  window.askAgent = async function(s, userMsg) {
    if (!s) return "";
    if (!s.active) return "الحساب موقوف حالياً لإنهاء الخدمة.";

    const key = (typeof geminiKey !== "undefined" && geminiKey) ? geminiKey : (localStorage.getItem("model_gemini_key") || "");
    const mod = (typeof geminiModel !== "undefined" && geminiModel) ? geminiModel : (localStorage.getItem("model_gemini_model") || "gemini-3.8-flash");

    if (key && typeof origAsk === "function") {
      try {
        const res = await Promise.race([
          origAsk(s, userMsg),
          new Promise(resolve => setTimeout(() => resolve("__TIMEOUT__"), 6500))
        ]);
        if (res && res !== "__TIMEOUT__" && !/^\s*(❌|تنبيه من Gemini)/i.test(String(res))) {
          return res;
        }
        if (/high demand|503|overloaded|unavailable/i.test(String(res)) || res === "__TIMEOUT__") {
          return buildPersonaFallback(s, userMsg, "ضغط مرتفع مؤقت على خوادم Gemini (503)");
        }
      } catch (e) {}
    }

    return buildPersonaFallback(s, userMsg, key ? "الرد الفوري بالشخصية والذاكرة المشتركة" : "لم يتم إدخال مفتاح API بعد");
  };
})();
</script>
