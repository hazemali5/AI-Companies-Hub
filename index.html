<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MODEL Studio OS — مكتب الديكور والهندسة</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #090d16; color: #f8fafc; }
  #scene-host { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; }

  .topbar {
    position: fixed; top: 12px; left: 12px; right: 12px; min-height: 52px;
    background: rgba(12, 18, 28, 0.92); backdrop-filter: blur(14px);
    border: 1px solid rgba(212, 175, 55, 0.32); border-radius: 14px;
    padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    z-index: 30;
  }
  .title { font-size: 14px; font-weight: 800; color: #d4af37; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    background: #162032; color: #f8fafc; border: 1px solid rgba(148,163,184,0.22);
    padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { border-color: #d4af37; }
  .btn.gold { background: #d4af37; color: #090d16; border-color: #d4af37; }

  .sidebar {
    position: fixed; top: 76px; right: 12px; bottom: 12px; width: 265px;
    background: rgba(12, 18, 28, 0.92); backdrop-filter: blur(14px);
    border: 1px solid rgba(148,163,184,0.18); border-radius: 16px;
    padding: 12px; z-index: 20; overflow-y: auto;
  }
  .sec { font-size: 11px; color: #d4af37; font-weight: 800; margin-bottom: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  .dept { font-size: 11.5px; font-weight: 700; color: #e2e8f0; background: #182336; border-right: 3px solid #d4af37; padding: 5px 8px; border-radius: 6px; margin: 8px 0 5px; }
  .emp {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 8px; border-radius: 8px; background: #121b2b; margin-bottom: 4px; cursor: pointer; font-size: 12px;
    border: 1px solid transparent;
  }
  .emp:hover, .emp.active { border-color: #d4af37; background: rgba(212,175,55,0.16); }

  .drawer {
    position: fixed; top: 76px; left: 12px; bottom: 12px; width: 420px; max-width: calc(100vw - 295px);
    background: rgba(11, 16, 26, 0.96); border: 1px solid rgba(212,175,55,0.38);
    border-radius: 16px; z-index: 28; display: none; flex-direction: column; overflow: hidden;
  }
  .d-head { padding: 12px 14px; background: #141e30; border-bottom: 1px solid rgba(148,163,184,0.15); display: flex; justify-content: space-between; align-items: flex-start; }
  .d-tabs { display: flex; border-bottom: 1px solid rgba(148,163,184,0.15); }
  .d-tab { flex: 1; padding: 8px; font-size: 11.5px; font-weight: 700; background: transparent; color: #94a3b8; border: none; cursor: pointer; }
  .d-tab.active { color: #d4af37; border-bottom: 2px solid #d4af37; background: rgba(212,175,55,0.08); }
  .d-body { flex: 1; overflow-y: auto; padding: 12px; display: none; flex-direction: column; gap: 9px; }
  .d-body.active { display: flex; }
  .msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 8px 11px; border-radius: 10px; font-size: 12px; line-height: 1.55; white-space: pre-wrap; max-width: 90%; }
  .msg.u { align-self: flex-start; background: #1d4ed8; color: #fff; }
  .msg.a { align-self: flex-end; background: #1a2538; color: #f1f5f9; border: 1px solid rgba(148,163,184,0.16); }
  .row { display: flex; gap: 6px; }
  .inp, .ta, .sel { width: 100%; background: #141f32; color: #fff; border: 1px solid rgba(148,163,184,0.22); border-radius: 8px; padding: 7px 9px; font-size: 12px; }
  .box { background: #141f32; border: 1px solid rgba(148,163,184,0.15); border-radius: 10px; padding: 10px; font-size: 12px; line-height: 1.55; }

  .modal-bg { position: fixed; inset: 0; background: rgba(3,6,12,0.78); display: none; align-items: center; justify-content: center; z-index: 50; padding: 14px; }
  .modal-box { width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto; background: #0e1522; border: 1px solid rgba(212,175,55,0.4); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #err-banner { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: #7f1d1d; color: #fecaca; border: 1px solid #ef4444; padding: 8px 14px; border-radius: 10px; font-size: 12px; z-index: 60; display: none; }
</style>
</head>
<body>

  <div class="btns">
    <button class="btn gold" onclick="camPreset('overview')">منظور عام</button>

</div>

    <div>
      <div id="d-name" style="font-size:16px;font-weight:800;"></div>

    </div>

    <button class="d-tab" id="tb-fb" onclick="openSub('fb')">تغذية راجعة</button>
  </div>
  <div class="d-body active" id="sv-chat">
    <div class="msgs" id="msgs"></div>

      <input class="inp" id="chat-inp" placeholder="ناقش الموظف أو أعطه أمراً..." onkeydown="if(event.key==='Enter') sendChat()">

</section>

<div class="modal-bg" id="m-cast">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;"><strong style="color:#d4af37;">📢 توجيه أمر لقسم أو للجميع</strong><button class="btn" onclick="closeM('m-cast')">✕</button></div>
    <select class="sel" id="cast-target">
      <option value="ALL">كامل المكتب (الجميع)</option>
      <option value="الإدارة العليا">الإدارة العليا</option>
      <option value="القسم الهندسي">القسم الهندسي</option>
      <option value="الاستقطاب والتسويق">الاستقطاب والتسويق</option>
      <option value="الإدارة المساندة">الإدارة المساندة</option>
    </select>
    <textarea class="ta" id="cast-txt" placeholder="اكتب الأمر الإداري أو التوجيه هنا..."></textarea>
    <button class="btn gold" onclick="runBroadcast()">إرسال وجمع الآراء</button>
    <div id="cast-out" style="display:flex;flex-direction:column;gap:6px;"></div>
  </div>
</div>

<div class="modal-bg" id="m-meet">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;"><strong style="color:#d4af37;">🤝 قاعة الاجتماعات</strong><button class="btn" onclick="closeM('m-meet')">✕</button></div>
    <input class="inp" id="meet-topic" placeholder="موضوع الاجتماع...">
    <button class="btn gold" onclick="runMeeting()">بدء الاجتماع وتوليد المحضر</button>
    <div id="meet-out" style="display:flex;flex-direction:column;gap:6px;"></div>
  </div>
</div>

<div class="modal-bg" id="m-ai">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;"><strong style="color:#d4af37;">⚡ ربط Gemini API</strong><button class="btn" onclick="closeM('m-ai')">✕</button></div>
    <input class="inp" type="password" id="ai-key" placeholder="AIzaSy...">
    <button class="btn gold" onclick="saveKey()">حفظ المفتاح</button>
  </div>
</div>

<div id="err-banner"></div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>

  { id:"tareq", name:"م. طارق", role:"المدير العام", dept:"الإدارة العليا", rank:"قيادي", lvl:5, active:true, persona:"حازم واستراتيجي، يركز على التميز والسمعة والعائد طويل المدى.", exp:"قيادة المكاتب الهندسية، التوسع، الحوكمة، والشراكات.", skills:["القيادة الاستراتيجية","الحوكمة"], x:-11.5, z:-8.5, col:0xd4af37 },

  { id:"lina", name:"م. لينا", role:"مديرة المشاريع", dept:"الإدارة العليا", rank:"قيادي", lvl:4, active:true, persona:"دقيقة ومنظمة، تربط بين التصميم والتنفيذ والتسليم.", exp:"إدارة المشاريع، تنسيق التخصصات، متابعة المراحل.", skills:["إدارة المشاريع","التنسيق"], x:-1.5, z:-8.5, col:0xf472b6 },
  { id:"karim", name:"م. كريم", role:"مهندس معماري", dept:"القسم الهندسي", rank:"أول", lvl:4, active:true, persona:"يهتم بالكتلة والفراغ والضوء الطبيعي والوظيفة المعمارية.", exp:"التصميم المعماري، دراسة الفراغات، المخططات التنفيذية.", skills:["التصميم المعماري","الفراغات"], x:-12, z:-1.5, col:0x10b981 },
  { id:"hani", name:"م. هاني", role:"مهندس مدني وإنشائي", dept:"القسم الهندسي", rank:"أول", lvl:4, active:true, persona:"رصين ودقيق في الأنظمة الإنشائية والأحمال والسلامة.", exp:"التحليل والنظام الإنشائي، دراسة الأحمال، المواصفات.", skills:["الأنظمة الإنشائية","الأحمال"], x:-7.5, z:-1.5, col:0x0ea5e9 },
  { id:"salma", name:"م. سلمى", role:"مصممة ديكور داخلي", dept:"القسم الهندسي", rank:"أول", lvl:4, active:true, persona:"حساسة للخامات والإضاءة والألوان وتناغم الفراغ الداخلي.", exp:"التصميم الداخلي، الخامات والتشطيبات، الإضاءة الداخلية.", skills:["الديكور الداخلي","الخامات والإضاءة"], x:-3, z:-1.5, col:0xf59e0b },
  { id:"ziad", name:"م. زياد", role:"مصمم واجهات وديكور خارجي", dept:"القسم الهندسي", rank:"متخصص", lvl:3, active:true, persona:"يركز على الواجهات والمداخل وتكامل المشهد الخارجي.", exp:"تصميم الواجهات، الديكور الخارجي، المساحات الخارجية.", skills:["الواجهات","الديكور الخارجي"], x:-12, z:3.5, col:0x34d399 },
  { id:"nader", name:"م. نادر", role:"مهندس كميات وتكاليف (BOQ)", dept:"القسم الهندسي", rank:"أول", lvl:4, active:true, persona:"رقمي ومدقق في حصر الكميات وجداول التكاليف والبدائل.", exp:"حصر الكميات، جداول BOQ، تحليل الأسعار والتكاليف.", skills:["حصر الكميات","BOQ"], x:-7.5, z:3.5, col:0xa78bfa },
  { id:"bilal", name:"م. بلال", role:"مهندس إشراف وموقع", dept:"القسم الهندسي", rank:"متخصص", lvl:3, active:true, persona:"ميداني ويقظ، يطابق التنفيذ الفعلي مع المخططات والمواصفات.", exp:"الإشراف الهندسي، متابعة الموقع، فحص المطابقة.", skills:["الإشراف الميداني","جودة التنفيذ"], x:-3, z:3.5, col:0x2dd4bf },
  { id:"nadeem", name:"م. نديم", role:"مستقطب المشاريع", dept:"الاستقطاب والتسويق", rank:"أول", lvl:4, active:true, persona:"استباقي في اقتناص الفرص وصياغة العروض للعملاء.", exp:"استقطاب المشاريع، دراسة الفرص، كتابة العروض.", skills:["اقتناص الفرص","العروض"], x:5.5, z:-8.5, col:0xfbbf24 },
  { id:"adam", name:"آدم", role:"مدير السوشيال ميديا", dept:"الاستقطاب والتسويق", rank:"متخصص", lvl:3, active:true, persona:"منظم في جدولة النشر ومتابعة التفاعل والمنصات.", exp:"إدارة المنصات، جدولة المحتوى، متابعة التفاعل.", skills:["السوشيال ميديا","الجدولة"], x:10.5, z:-8.5, col:0xfb923c },
  { id:"yara", name:"يارا", role:"أخصائية التسويق والمحتوى", dept:"الاستقطاب والتسويق", rank:"متخصص", lvl:3, active:true, persona:"تصوغ الرسائل التسويقية وسابقة الأعمال بوضوح وإقناع.", exp:"كتابة المحتوى، الرسائل التسويقية، عرض المشاريع.", skills:["المحتوى","الهوية التسويقية"], x:8, z:-4, col:0xf43f5e },
  { id:"dana", name:"دانا", role:"الموارد البشرية (HR)", dept:"الإدارة المساندة", rank:"متخصص", lvl:3, active:true, persona:"تنظم الأدوار وتوازن المهام وتتابع الأداء والكفاءات.", exp:"تحديد الأدوار، تقييم الأداء، تطوير الكفاءات.", skills:["الموارد البشرية","تقييم الأداء"], x:5.5, z:2.5, col:0xc084fc },
  { id:"fouad", name:"أ. فؤاد", role:"المستشار القانوني", dept:"الإدارة المساندة", rank:"مستشار", lvl:4, active:true, persona:"يدقق في العقود والالتزامات ويحمي حقوق المكتب.", exp:"مراجعة العقود، إدارة المخاطر، الصياغات النظامية.", skills:["العقود","المخاطر"], x:10.5, z:2.5, col:0x818cf8 },
  { id:"samar", name:"سمر", role:"المحاسبة والمالية", dept:"الإدارة المساندة", rank:"متخصص", lvl:3, active:true, persona:"تضبط التدفقات النقدية والفواتير والميزانيات بدقة.", exp:"المحاسبة المالية، التدفقات، الفوترة والتقارير.", skills:["المحاسبة","التدفق المالي"], x:8, z:7, col:0x22d3ee }
];

const mem = {};
const sharedLog = ["تأسيس مقر MODEL الهندسي والديكور بكافة أقسامه."];
let geminiKey = localStorage.getItem("model_gemini_key") || "";
STAFF.forEach(s => {
  mem[s.id] = { chats: [{ who:"a", text:`أهلاً أستاذ حازم. أنا ${s.name} (${s.role}).\n${s.persona}` }], fb: [] };
});

let curId = null;
const avatarBodies = {};
let camera, controls;

function openM(id) {
  if (id === "m-ai") document.getElementById("ai-key").value = geminiKey;
  document.getElementById(id).style.display = "flex";
}
function closeM(id) { document.getElementById(id).style.display = "none"; }
function saveKey() {
  geminiKey = document.getElementById("ai-key").value.trim();
  localStorage.setItem("model_gemini_key", geminiKey);
  closeM("m-ai");
}

function renderNav() {
  const nav = document.getElementById("staff-nav");
  nav.innerHTML = "";
  ["الإدارة العليا","القسم الهندسي","الاستقطاب والتسويق","الإدارة المساندة"].forEach(d => {
    const dh = document.createElement("div");
    dh.className = "dept";
    dh.innerText = d;
    nav.appendChild(dh);
    STAFF.filter(s => s.dept === d).forEach(s => {
      const el = document.createElement("div");
      el.className = `emp ${s.id === curId ? "active" : ""}`;
      el.innerHTML = `<span>${s.name} ${!s.active ? "(موقوف)" : ""}</span><span style="color:#d4af37;font-size:10.5px;">${s.rank} • م${s.lvl}</span>`;
      el.onclick = () => selectEmp(s.id, true);
      nav.appendChild(el);
    });
  });
}

function selectEmp(id, moveCam) {
  const s = STAFF.find(x => x.id === id);
  if (!s) return;
  curId = id;
  renderNav();
  document.getElementById("d-name").innerText = s.name;
  document.getElementById("d-role").innerText = `${s.role} • ${s.dept} • ${s.rank} (درجة ${s.lvl})`;
  document.getElementById("d-persona").innerText = s.persona;
  renderMsgs(); renderProf(); renderFb();
  document.getElementById("drawer").style.display = "flex";
  if (moveCam && camera && controls) {
    controls.target.set(s.x, 1, s.z);
    camera.position.set(s.x + 4.5, 5.2, s.z + 6.5);
  }
}

function closeDrawer() { curId = null; document.getElementById("drawer").style.display = "none"; renderNav(); }
function openSub(tab) {
  ["chat","prof","fb"].forEach(t => {
    document.getElementById("tb-"+t).classList.toggle("active", t === tab);
    document.getElementById("sv-"+t).classList.toggle("active", t === tab);
  });
}

async function askAgent(s, userMsg) {
  if (!s.active) return "الحساب موقوف حالياً لإنهاء الخدمة.";
  const fbText = mem[s.id].fb.join(" | ");
  if (geminiKey) {
    try {
      const prompt = `أنت ${s.name} (${s.role} في ${s.dept}) بمكتب MODEL للديكور والهندسة. شخصيتك: ${s.persona}. خبراتك: ${s.exp} (${s.skills.join("، ")}). ملاحظات المدير لك: ${fbText || "لا يوجد"}. سجل المكتب: ${sharedLog.slice(0,4).join(" | ")}. أجب برأيك المهني المباشر على: ${userMsg}`;
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(geminiKey)}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }] })
      });
      const j = await r.json();
      const out = j?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (out) return out.trim();
    } catch (e) {}
  }
  const fbNote = fbText ? `\n• مع مراعاة ملاحظتك: "${mem[s.id].fb[0]}"` : "";
  return `بصفتي ${s.name} (${s.role})، رأيي حول "${userMsg}":\n• ${s.persona}\n• سأتعامل مع الملف عبر (${s.skills.join(" و ")}).${fbNote}`;
}

function renderMsgs() {
  const s = STAFF.find(x => x.id === curId);
  const box = document.getElementById("msgs");
  box.innerHTML = mem[curId].chats.map(m => `<div class="msg ${m.who}"><strong>${m.who==="u"?"حازم":s.name}:</strong>\n${m.text}</div>`).join("");
  box.scrollTop = box.scrollHeight;
}

async function sendChat() {
  if (!curId) return;
  const inp = document.getElementById("chat-inp");
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = "";
  const s = STAFF.find(x => x.id === curId);
  mem[curId].chats.push({ who:"u", text: txt });
  renderMsgs();
  const rep = await askAgent(s, txt);
  mem[curId].chats.push({ who:"a", text: rep });
  sharedLog.unshift(`حوار ${s.name}: ${txt.slice(0,50)}`);
  renderMsgs();
}

function renderProf() {
  const s = STAFF.find(x => x.id === curId);
  document.getElementById("prof-box").innerHTML = `<strong>الخبرات:</strong> ${s.exp}<br><br><strong>المهارات:</strong> ${s.skills.join(" • ")}`;
}
function addSkill() {
  const inp = document.getElementById("skill-inp");
  const v = inp.value.trim();
  if (!v || !curId) return;
  STAFF.find(x => x.id === curId).skills.push(v);
  inp.value = ""; renderProf();
}
function addFeedback() {
  const ta = document.getElementById("fb-ta");
  const v = ta.value.trim();
  if (!v || !curId) return;
  mem[curId].fb.unshift(v);
  ta.value = ""; renderFb();
}
function renderFb() {
  document.getElementById("fb-list").innerHTML = mem[curId].fb.map(x => `<div class="box">${x}</div>`).join("");
}
function doHr(type) {
  if (!curId) return;
  const s = STAFF.find(x => x.id === curId);
  if (type === "promote") { s.lvl += 1; s.rank = s.lvl >= 5 ? "قيادي" : "أول"; sharedLog.unshift(`ترقية ${s.name} إلى درجة ${s.lvl}`); }
  if (type === "reward") { mem[curId].chats.push({ who:"a", text:"شكراً أستاذ حازم على المكافأة والتحفيز." }); sharedLog.unshift(`مكافأة لـ ${s.name}`); }
  if (type === "fire") { s.active = !s.active; sharedLog.unshift(`${s.active?"إعادة":"إنهاء"} خدمة ${s.name}`); }
  renderNav(); selectEmp(s.id, false);
}

async function runBroadcast() {
  const t = document.getElementById("cast-target").value;
  const txt = document.getElementById("cast-txt").value.trim();
  if (!txt) return;
  const list = STAFF.filter(s => s.active && (t === "ALL" || s.dept === t));
  const out = document.getElementById("cast-out");
  out.innerHTML = `<div class="box">جاري جمع ردود (${list.length}) موظفين...</div>`;
  sharedLog.unshift(`أمر (${t}): ${txt}`);
  const htmls = [];
  for (const s of list) {
    const r = await askAgent(s, txt);
    htmls.push(`<div class="box"><strong>${s.name} (${s.role}):</strong><br>${r}</div>`);
  }
  out.innerHTML = htmls.join("");
}

async function runMeeting() {
  const topic = document.getElementById("meet-topic").value.trim() || "مراجعة مشاريع المكتب";
  const out = document.getElementById("meet-out");
  out.innerHTML = `<div class="box">انعقاد الاجتماع حول: ${topic}...</div>`;
  sharedLog.unshift(`اجتماع: ${topic}`);
  const leaders = STAFF.filter(s => s.active).slice(0, 6);
  const htmls = [];
  for (const s of leaders) {
    const r = await askAgent(s, `في اجتماع المكتب حول: ${topic}، ما رأيك وتوصيتك؟`);
    htmls.push(`<div class="box"><strong>${s.name} (${s.role}):</strong><br>${r}</div>`);
  }
  out.innerHTML = htmls.join("");
}

function camPreset(p) {
  if (!camera || !controls) return;
  const map = {
    overview: [[0, 22, 26], [0, 0, 0]],
    top: [[0, 36, 0.1], [0, 0, 0]],
    reception: [[0, 6, 17], [0, 0.7, 10]],
    meeting: [[-11.5, 6, 17], [-11.5, 0.8, 10.5]],
    pantry: [[11.5, 6, 17], [11.5, 0.8, 9.8]],
    exec: [[-6.5, 7.5, -1.5], [-6.5, 0.8, -8.5]],
    eng: [[-7.5, 11.5, 8.5], [-7.5, 0.8, 1]],
    mkt: [[8, 9.5, 0.5], [8, 0.8, -7]],
    admin: [[8, 9.5, 11.5], [8, 0.8, 4]]
  };
  const v = map[p] || map.overview;
  camera.position.set(...v[0]);
  controls.target.set(...v[1]);
}

function init3D() {
  if (typeof THREE === "undefined") throw new Error("مكتبة Three.js لم تُحمّل.");
  let host = document.getElementById("scene-host");
  if (!host) {
    host = document.createElement("div");
    host.id = "scene-host";
    document.body.prepend(host);
  }
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x090d16);

  camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 22, 26);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  host.appendChild(renderer.domElement);

  if (typeof THREE.OrbitControls !== "undefined") {
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2.08;
  }

  scene.add(new THREE.AmbientLight(0xe2e8f0, 0.75));
  const dir = new THREE.DirectionalLight(0xfff7ed, 1.0);
  dir.position.set(16, 28, 18);
  dir.castShadow = true;
  scene.add(dir);

  const floor = new THREE.Mesh(new THREE.BoxGeometry(36, 0.4, 28), new THREE.MeshStandardMaterial({ color: 0x3b2618, roughness: 0.45 }));
  floor.position.y = -0.2;
  floor.receiveShadow = true;
  scene.add(floor);

  const grid = new THREE.GridHelper(36, 18, 0xd4af37, 0x1e293b);
  grid.position.y = 0.01;
  scene.add(grid);

  const glassMat = new THREE.MeshStandardMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.18 });
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
  function addWall(x, z, w, d) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, 2.2, d), glassMat);
    m.position.set(x, 1.1, z);
    const top = new THREE.Mesh(new THREE.BoxGeometry(w, 0.12, d), frameMat);
    top.position.set(x, 2.2, z);
    scene.add(m, top);
  }
  addWall(0.5, -4.8, 0.16, 8.5);
  addWall(0.5, 4.8, 0.16, 7.5);
  addWall(-6.5, 7.6, 14.5, 0.16);
  addWall(6.8, 7.6, 10.5, 0.16);

  const conf = new THREE.Mesh(new THREE.BoxGeometry(6.0, 0.14, 1.9), new THREE.MeshStandardMaterial({ color: 0x4a2e1b }));
  conf.position.set(-11.5, 0.82, 10.5);
  scene.add(conf);

  const pantry = new THREE.Mesh(new THREE.BoxGeometry(4.4, 1.0, 1.1), new THREE.MeshStandardMaterial({ color: 0x2c1d14 }));
  pantry.position.set(11.5, 0.5, 9.2);
  scene.add(pantry);

  const rec = new THREE.Mesh(new THREE.BoxGeometry(4.6, 1.05, 1.2), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
  rec.position.set(0, 0.525, 10.2);
  scene.add(rec);

  const picks = [];
  STAFF.forEach(s => {
    const grp = new THREE.Group();
    grp.position.set(s.x, 0, s.z);

    const desk = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.1, 1.0), new THREE.MeshStandardMaterial({ color: 0x5c3a21 }));
    desk.position.y = 0.76;
    grp.add(desk);

    const scr = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.42, 0.05), new THREE.MeshStandardMaterial({ color: 0x0f172a, emissive: s.col, emissiveIntensity: 0.35 }));
    scr.position.set(0, 1.02, 0.12);
    grp.add(scr);

    const mat = new THREE.MeshStandardMaterial({ color: s.col });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.3, 0.82, 16), mat);
    body.position.set(0, 0.72, -0.55);
    body.userData.id = s.id;
    grp.add(body);
    picks.push(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), new THREE.MeshStandardMaterial({ color: 0xf1c27d }));
    head.position.set(0, 1.32, -0.55);
    head.userData.id = s.id;
    grp.add(head);
    picks.push(head);

    avatarBodies[s.id] = { mat, col: s.col };
    scene.add(grp);
  });

  const ray = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  renderer.domElement.addEventListener("click", e => {
    const r = renderer.domElement.getBoundingClientRect();
    ptr.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    ptr.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(picks);
    if (hit.length) selectEmp(hit[0].object.userData.id, false);
  });

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  (function animate() {
    requestAnimationFrame(animate);
    STAFF.forEach(s => {
      if (avatarBodies[s.id]) avatarBodies[s.id].mat.color.setHex(s.active ? s.col : 0x475569);
    });
    if (controls) controls.update();
    renderer.render(scene, camera);
  })();
}

window.addEventListener("load", () => {
  renderNav();
  try {
    init3D();
  } catch (e) {
    const b = document.getElementById("err-banner");
    b.style.display = "block";
    b.innerText = "خطأ في تشغيل المشهد: " + e.message;
  }
});
</script>
</body>
</html>
